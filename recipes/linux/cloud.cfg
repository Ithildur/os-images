disable_root: false
ssh_pwauth: true
preserve_hostname: false
datasource_list: [NoCloud]
growpart:
  mode: auto
  devices: ['/']
  ignore_growroot_disabled: false
resize_rootfs: true
system_info:
  default_user:
    name: root
    lock_passwd: true
    gecos: root
    groups: []
    shell: /bin/bash
