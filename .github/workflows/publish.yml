name: publish image Catalog

on:
  workflow_dispatch:
    inputs:
      image:
        description: Publish latest completed build for image key, or all
        required: true
        default: all
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive

concurrency:
  group: image-storage
  cancel-in-progress: false

jobs:
  publish:
    environment: R2
    runs-on: ubuntu-24.04
    container:
      image: debian:13-slim
      options: --user 0:0
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # Use ordinary SigV4 uploads for R2 instead of streaming checksum trailers.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      IMAGE_KEY: ${{ inputs.image }}
    steps:
      - name: Install publishing tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends awscli ca-certificates git jq openssl python3

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate publishing configuration
        run: |
          : "${AWS_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID secret is required in the R2 environment}"
          : "${AWS_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY secret is required in the R2 environment}"
          : "${R2_ENDPOINT_URL:?R2_ENDPOINT_URL secret is required in the R2 environment}"
          : "${R2_BUCKET:?R2_BUCKET secret is required in the R2 environment}"
          if [[ "${R2_ENDPOINT_URL}" != https://* ]]; then
            printf '::error::R2_ENDPOINT_URL must use HTTPS\n' >&2
            exit 1
          fi

      - name: Verify images, sign and publish Catalog
        env:
          CATALOG_SIGNING_KEY_PEM: ${{ secrets.CATALOG_SIGNING_KEY_PEM }}
        run: |
          : "${CATALOG_SIGNING_KEY_PEM:?CATALOG_SIGNING_KEY_PEM secret is required in the R2 environment}"
          work="$(mktemp -d "${RUNNER_TEMP}/catalog.XXXXXXXX")"
          key="${work}/catalog-signing.pem"
          trap 'rm -f -- "${key}"' EXIT
          umask 077
          printf '%s' "${CATALOG_SIGNING_KEY_PEM}" >"${key}"
          openssl pkey -in "${key}" -pubout -out "${work}/derived-public.pem"
          cmp "${work}/derived-public.pem" catalog/keys/catalog-2026-01.pem

          current_args=()
          exists="$(python3 scripts/storage.py fetch-catalog --output "${work}/current.json")"
          if [[ "${exists}" == true ]]; then
            current_args=(--current "${work}/current.json")
          fi
          selected="$(python3 scripts/images.py matrix "${IMAGE_KEY}")"
          jq --raw-output '.[]' <<<"${selected}" >"${work}/images"
          while IFS= read -r image; do
            python3 scripts/storage.py latest --image "${image}" --output "${work}/build.json"
            object_key="$(jq --exit-status --raw-output .object_key "${work}/build.json")"
            digest="$(jq --exit-status --raw-output .result_sha256 "${work}/build.json")"
            size="$(jq --exit-status --raw-output .size_bytes "${work}/build.json")"
            aws --endpoint-url "${R2_ENDPOINT_URL}" s3 cp \
              "s3://${R2_BUCKET}/${object_key}" "${work}/image.qcow2" --only-show-errors
            printf '%s  %s\n' "${digest}" "${work}/image.qcow2" | sha256sum --check --strict
            [[ "$(stat -c '%s' "${work}/image.qcow2")" == "${size}" ]]
            rm -- "${work}/image.qcow2"

            python3 scripts/catalog.py publish "${current_args[@]}" \
              --public-key catalog/keys/catalog-2026-01.pem --private-key "${key}" \
              --build "${work}/build.json" --output "${work}/catalog.json"
            mv -- "${work}/catalog.json" "${work}/current.json"
            current_args=(--current "${work}/current.json")
          done <"${work}/images"

          aws --endpoint-url "${R2_ENDPOINT_URL}" s3 cp "${work}/current.json" \
            "s3://${R2_BUCKET}/catalog.json" --content-type application/json --cache-control no-store --only-show-errors
          cp "${work}/current.json" "${RUNNER_TEMP}/catalog.json"
          printf 'Published catalog.json for %s.\n' "${IMAGE_KEY}" >>"${GITHUB_STEP_SUMMARY}"

      - name: Update latest pointers and remove obsolete revisions
        run: python3 scripts/storage.py prune --image "${IMAGE_KEY}" --catalog "${RUNNER_TEMP}/catalog.json"

      - name: Upload signed Catalog
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalog
          path: ${{ runner.temp }}/catalog.json
          if-no-files-found: error
          retention-days: 90
