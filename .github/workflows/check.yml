name: check

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  static:
    runs-on: ubuntu-24.04
    container:
      image: debian:13-slim
      options: --user 0:0
    steps:
      - name: Install static analyzers
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git golang-go make openssl python3 shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          printf '%s\n' "$(go env GOPATH)/bin" >>"${GITHUB_PATH}"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check recipes, workflows, and Catalog signing
        run: make check
